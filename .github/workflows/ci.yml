name: CI

# The three checks that existed before this file were all Vercel build/deploy
# statuses. A green PR meant "it builds", never "the tests pass" — nothing ran
# them outside a developer's terminal.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The skills live in .agents/* submodules. Without them
          # test/upstream-contract.test.ts skips instead of failing — and that
          # test exists specifically to catch an upstream heading rename, so
          # letting it skip in CI would defeat the point of having it.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type stripping runs the TypeScript sources directly — no build step.
      # A skipped test is a green test, so the log is checked as well as the
      # exit code: the upstream contract test skips when the submodule is
      # missing, and that test exists specifically to catch an upstream
      # heading rename. Letting it skip in CI would defeat the point.
      - name: Tests
        run: |
          npm test 2>&1 | tee /tmp/test.log
          if grep -q "social-media-skills submodule not checked out" /tmp/test.log; then
            echo "::error::The upstream contract test skipped — submodules did not check out."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Catches a broken import or a Tailwind/@theme change that typechecks
      # but will not compile. Vercel would catch it too, several minutes later.
      - name: Build
        run: npm run build

  responsive:
    name: responsive geometry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the browser between runs — it is ~170MB and unchanged unless the
      # pinned Playwright version moves.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The audit measures the production build, not the dev server: dev has
      # different hydration timing and no CSS minification.
      - name: Build
        run: npm run build

      # Fails on horizontal overflow, an element wider than its parent, a
      # collapsed nav/tab strip, a sub-34px tap target at a touch breakpoint,
      # or a console error — across 3 breakpoints x 2 themes x 12 views.
      # The contract these defend is documented in docs/RESPONSIVE.md.
      # A crashed run must never look like a pass. The script prints exactly one
      # PASSED/FAILED line, so its absence means it died before reporting — the
      # same reasoning as the skipped-test guards in the job above.
      - name: Responsive geometry audit
        run: |
          set -o pipefail
          npm run audit:responsive 2>&1 | tee /tmp/responsive.log
          if ! grep -qE '^(PASSED|FAILED)' /tmp/responsive.log; then
            echo "::error::The responsive audit never reported a verdict — it crashed before finishing."
            exit 1
          fi

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-log
          path: /tmp/responsive.log
          if-no-files-found: ignore

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Postgres integration tests
        env:
          POSTGRES_TEST_URL: postgres://postgres@localhost:5432/postgres
        run: |
          npm run test:pg 2>&1 | tee /tmp/pg.log
          if grep -q "set POSTGRES_TEST_URL to run" /tmp/pg.log; then
            echo "::error::Integration tests skipped — POSTGRES_TEST_URL did not reach them."
            exit 1
          fi
